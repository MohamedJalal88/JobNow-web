name: Appium Mobile Test Report

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  appium-mobile-test-report:
    name: Appium Mobile Test Report Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Appium Excel Test Report
        run: node generate-appium-excel.cjs

      - name: Upload Appium Mobile Test Report Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-Test-Report
          path: Appium_Mobile_Test_Report.xlsx
