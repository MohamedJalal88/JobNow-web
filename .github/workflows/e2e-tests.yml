name: E2E Tests & Report Generation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: selenium-tests/package-lock.json

      - name: Create Report Directory
        run: mkdir -p "Vulnerability Test Results"

      - name: Install Project Dependencies
        run: |
          npm install
          cd selenium-tests
          npm install

      - name: Run E2E Tests
        run: |
          node selenium-tests/run-tests.mjs

      - name: Run Security Audit Report
        run: |
          node generate-excel.cjs

      - name: Upload Excel Test & Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: E2E-and-Security-Test-Reports
          path: "Vulnerability Test Results/"

      - name: Upload All Testcases Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: JobNow-All-Testcases-Report
          path: "Vulnerability Test Results/JobNow_All_Testcases.xlsx"
