name: E2E Tests & Report Generation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: selenium-tests/package-lock.json

      - name: Create Report Directory
        run: mkdir -p "Vulnerability Test Results"

      - name: Install Selenium Dependencies
        run: |
          cd selenium-tests
          npm ci

      - name: Run E2E Tests
        run: |
          node selenium-tests/run-tests.mjs

      - name: Upload Excel Test Report
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Test-Report
          path: "Vulnerability Test Results/E2E_Test_Report.xlsx"
